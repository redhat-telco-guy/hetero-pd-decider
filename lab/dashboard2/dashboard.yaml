# Hetero-PD lab dashboard (v2): page + API that drives traffic and switches the router's decider.
apiVersion: v1
kind: ServiceAccount
metadata: {name: hetero-pd-dashboard}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: hetero-pd-dashboard}
rules:
  - {apiGroups: [""], resources: ["pods", "pods/log"], verbs: ["get", "list"]}
  - {apiGroups: ["apps"], resources: ["deployments"], resourceNames: ["hetero-pd-epp", "decode-gaudi3"], verbs: ["get", "patch"]}
  - {apiGroups: ["apps"], resources: ["deployments/scale"], resourceNames: ["decode-gaudi3"], verbs: ["get", "patch"]}
  - {apiGroups: [""], resources: ["configmaps"], resourceNames: ["hetero-pd-dashboard-results"], verbs: ["get", "update"]}
  - {apiGroups: [""], resources: ["configmaps"], verbs: ["create"]}
  - {apiGroups: [""], resources: ["configmaps"], resourceNames: ["kv-compat-approvals"], verbs: ["get", "patch"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: hetero-pd-dashboard}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: hetero-pd-dashboard}
subjects: [{kind: ServiceAccount, name: hetero-pd-dashboard}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hetero-pd-dashboard, labels: {app: hetero-pd-dashboard}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: hetero-pd-dashboard}}
  template:
    metadata: {labels: {app: hetero-pd-dashboard}}
    spec:
      serviceAccountName: hetero-pd-dashboard
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: NotIn, values: ["worker2.ai154.dl154.dfw.ocp.run"]}
                  - {key: node-role.kubernetes.io/worker, operator: Exists}
      containers:
        - name: dashboard
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["python3", "-u", "/app/server.py"]
          env: [{name: MODEL, value: "Qwen/Qwen2.5-7B-Instruct"}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 200m, memory: 128Mi}, limits: {memory: 512Mi}}
          volumeMounts:
            - {name: app, mountPath: /app/server.py, subPath: server.py}
            - {name: web, mountPath: /app/web}
      volumes:
        - name: app
          configMap: {name: hetero-pd-dashboard-web, items: [{key: server.py, path: server.py}]}
        - name: web
          configMap: {name: hetero-pd-dashboard-web, items: [{key: index.html, path: index.html}]}
---
apiVersion: v1
kind: Service
metadata: {name: hetero-pd-dashboard}
spec:
  selector: {app: hetero-pd-dashboard}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: hetero-pd-dashboard}
spec:
  to: {kind: Service, name: hetero-pd-dashboard}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
