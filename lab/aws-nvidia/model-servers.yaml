apiVersion: apps/v1
kind: Deployment
metadata: {name: decode-l4}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: decode-l4}}
  template:
    metadata:
      labels: {app: decode-l4, llm-d.ai/inference-serving: "true", llm-d.ai/guide: hetero-pd, llm-d.ai/role: decode, llm-d.ai/accelerator-class: nvidia-l4}
    spec:
      serviceAccountName: hetero-pd
      nodeSelector: {nvidia.com/gpu.product: __L4_PRODUCT__}
      initContainers:
        - name: routing-proxy
          image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v1.0.0
          args: ["--port=8000", "--kv-connector=nixlv2", "--zap-log-level=1", "--secure-serving=false"]
          ports: [{name: sidecar, containerPort: 8000, protocol: TCP}]
          restartPolicy: Always
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true}
      containers:
        - name: modelserver
          image: docker.io/vllm/vllm-openai:v0.26.0
          command: ["vllm", "serve"]
          args: ["__MODEL__", "--port=8200", "--dtype=half", "--block-size=16", "--max-model-len=8192",
                 "--gpu-memory-utilization=0.85", "--disable-access-log-for-endpoints=/health,/metrics,/v1/models",
                 __BACKEND_ARG__"--kv-transfer-config", '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_buffer_device":"cpu"}']
          env:
            - {name: HF_TOKEN, valueFrom: {secretKeyRef: {name: llm-d-hf-token, key: HF_TOKEN}}}
            - {name: VLLM_NIXL_SIDE_CHANNEL_HOST, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: VLLM_NIXL_SIDE_CHANNEL_PORT, value: "5600"}
            - {name: UCX_TLS, value: tcp}
          ports:
            - {name: modelserver, containerPort: 8200, protocol: TCP}
            - {name: nixl, containerPort: 5600, protocol: TCP}
          readinessProbe: {httpGet: {path: /v1/models, port: modelserver}, periodSeconds: 10}
          startupProbe: {httpGet: {path: /v1/models, port: modelserver}, periodSeconds: 10, failureThreshold: 90}
          resources:
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
            limits: {memory: 48Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {mountPath: /dev/shm, name: shm}
            - {mountPath: /root/.cache/huggingface, name: hf-cache}
      volumes:
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 2Gi}}
        - {name: hf-cache, emptyDir: {}}
