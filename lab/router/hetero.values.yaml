# hetero-pd-decider. Replace profiles and bandwidthGbps with the output of
# scripts/profile_prefill.py and scripts/measure_link.sh.
router:
  epp:
    pluginsConfigFile: "hetero-pd-config.yaml"
    pluginsCustomConfig:
      hetero-pd-config.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: approx-prefix-cache-producer
          parameters:
            maxPrefixTokensToMatch: 16384
            lruCapacityPerServer: 31250
        - type: prefix-cache-scorer
        - type: queue-scorer
        - type: prefill-filter
        - type: decode-filter
        - type: max-score-picker
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: hetero-pd-decider
        - type: hetero-pd-decider
          parameters:
            kvBytesPerToken: 131072        # Llama-3.1-8B, bf16
            ttftSLOMs: 1000
            stallWeight: 0.25
            safetyMargin: 0.1
            maxDecodeKVUsage: 0.9
            minUncachedTokens: 256
            bandwidthGbps: 10              # REPLACE with measure_link.sh result
            avgQueuedPromptTokens: 1024
            fallbackNonCachedTokens: 1024
            profiles:                      # REPLACE with profile_prefill.py output
              nvidia-a30:
                prefillTokensPerSec: 5000
              intel-gaudi3:
                prefillTokensPerSec: 20000
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: max-score-picker
          - pluginRef: prefix-cache-scorer
            weight: 2
          - pluginRef: queue-scorer
            weight: 1
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: max-score-picker
          - pluginRef: prefix-cache-scorer
            weight: 2
          - pluginRef: queue-scorer
            weight: 1
