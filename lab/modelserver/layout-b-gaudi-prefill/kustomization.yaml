# Layout B: one Gaudi 3 prefills, the A30 decodes. Documented vllm-gaudi direction.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../common
resources:
  - prefill-gaudi3.yaml
  - decode-a30.yaml
images:
  - name: REPLACE_GAUDI_VLLM_IMAGE
    newName: image-registry.openshift-image-registry.svc:5000/hetero-pd-lab/vllm-gaudi-nixl
    newTag: v0.26.0-tfpin   # v0.26.0 + transformers pinned to the A30 image version
