# Layout A: A30 prefills, two Gaudi 3 cards decode.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../common
resources:
  - prefill-a30.yaml
  - decode-gaudi3.yaml
images:
  - name: REPLACE_GAUDI_VLLM_IMAGE
    newName: image-registry.openshift-image-registry.svc:5000/hetero-pd-lab/vllm-gaudi-nixl
    newTag: v0.26.0-tfpin   # v0.26.0 + transformers pinned to the A30 image version
