# Intel Gaudi 3 decode pods, one card each. The routing sidecar listens on 8000
# and runs the remote-prefill handshake; the engine listens on 8200.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode-gaudi3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: decode-gaudi3
  template:
    metadata:
      labels:
        app: decode-gaudi3
        llm-d.ai/inference-serving: "true"
        llm-d.ai/guide: hetero-pd
        llm-d.ai/role: decode
        llm-d.ai/accelerator-class: intel-gaudi3
        llm-d.ai/model-fingerprint: llama-3.1-8b-instruct-bf16
    spec:
      serviceAccountName: hetero-pd
      initContainers:
        - name: routing-proxy
          image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v1.0.0
          args:
            - --port=8000
            - --kv-connector=nixlv2
            - --zap-log-level=1
            - --secure-serving=false
          ports:
            - name: sidecar
              containerPort: 8000
              protocol: TCP
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
      containers:
        - name: modelserver
          # Built from vllm-gaudi .cd/Dockerfile.ubuntu.pytorch.vllm.nixl.latest at v0.26.0 (see README step 2).
          image: REPLACE_GAUDI_VLLM_IMAGE
          command: ["vllm", "serve"]
          args:
            - "meta-llama/Llama-3.1-8B-Instruct"
            - "--port=8200"
            - "--tensor-parallel-size=1"
            - "--dtype=bfloat16"
            - "--block-size=128"
            - "--max-model-len=8192"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--kv-transfer-config"
            - '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_buffer_device":"cpu","enable_permute_local_kv":true}'
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "5600"
            - name: UCX_TLS
              value: tcp
            # Heterogeneous KV layout path in vllm-gaudi. Verify against the
            # env_variables page of the release you build.
            - name: VLLM_HPU_HETERO_KV_LAYOUT
              value: "true"
            - name: PT_HPU_ENABLE_RESTORE_KV_LAYOUT
              value: "1"
            - name: PT_HPU_LAZY_MODE
              value: "1"
          ports:
            - name: modelserver
              containerPort: 8200
              protocol: TCP
            - name: nixl
              containerPort: 5600
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            periodSeconds: 10
            failureThreshold: 180   # Gaudi graph warmup can take 15+ minutes
          resources:
            requests:
              cpu: "16"
              memory: 96Gi
              habana.ai/gaudi: "1"
            limits:
              memory: 128Gi
              habana.ai/gaudi: "1"
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /root/.cache/huggingface
              name: hf-cache
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: hf-cache
          emptyDir: {}
