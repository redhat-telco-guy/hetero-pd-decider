# All router configs in one release, so the dashboard can switch between them
# by changing the EPP's --config-file argument (no helm needed for a switch).
#   helm upgrade --install hetero-pd <chart> -f common.values.yaml -f modes.values.yaml -f site.values.yaml
router:
  epp:
    pluginsConfigFile: "auto-pd-config.yaml"   # your plugin, auto strategy, is the default
    pluginsCustomConfig:
      hetero-pd-config.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: approx-prefix-cache-producer
          parameters:
            maxPrefixTokensToMatch: 16384
            lruCapacityPerServer: 31250
        - type: prefix-cache-scorer
        - type: queue-scorer
        - type: prefill-filter
        - type: decode-filter
        - type: max-score-picker
        - type: hetero-kv-compat-filter   # prefill profile: only pods that can take KV from the chosen decode pod
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: hetero-pd-decider
        - type: hetero-pd-decider
          parameters:
            kvBytesPerToken: 28672         # Qwen/Qwen2.5-1.5B-Instruct, fp16
            ttftSLOMs: 1000
            stallWeight: 0.25
            safetyMargin: 0.1
            maxDecodeKVUsage: 0.9
            minUncachedTokens: 256
            bandwidthGbps: 10              # REPLACE with measure_link.sh result
            handoffOverheadMs: 82   # measured: remote-path TTFT minus local TTFT
            stallFraction: 0.1   # chunked prefill: running streams lose ~10% of a local prefill
            avgQueuedPromptTokens: 1024
            fallbackNonCachedTokens: 1024
            strategy: model
            compatibility: auto           # keys must match (or be approved); no key in a mixed pool = no split
            compatibilityLabel: llm-d.ai/kv-compat-key
            approvedPairs: []             # "prefillKey->decodeKey", added only after lab/compat/61-validate-pair.sh passes
            failureThreshold: 3           # failed handoffs in a row that exclude a pair
            exclusionSeconds: 600
            profiles:                      # measured by 72-measure-profiles.sh
              nvidia-a10g:
                prefillTokensPerSec: 15135
              nvidia-l4:
                prefillTokensPerSec: 13144
              nvidia-t4:
                prefillTokensPerSec: 2146
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: hetero-kv-compat-filter
          - pluginRef: max-score-picker
          - pluginRef: prefix-cache-scorer
            weight: 2
          - pluginRef: queue-scorer
            weight: 1
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: max-score-picker
          - pluginRef: prefix-cache-scorer
            weight: 2
          - pluginRef: queue-scorer
            weight: 1
      guarded-pd-config.yaml: |
